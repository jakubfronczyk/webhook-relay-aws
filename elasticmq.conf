# ElasticMQ speaks the SQS wire protocol, so the app has one queue
# implementation and only the endpoint URL differs between here and AWS.
#
# The queue definitions below mirror what modules/messaging will create in
# Phase 3: a delivery queue with a redrive policy into a dead-letter queue.

include classpath("application.conf")

node-address {
    protocol = http
    host = elasticmq
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    # Reject anything real SQS would reject, so the app cannot come to depend
    # on a leniency that disappears in AWS.
    sqs-limits = strict
}

queues {
    webhook-relay-deliveries {
        # Must stay above worst-case delivery time, or SQS hands the message to
        # a second worker while the first is still POSTing and the subscriber
        # sees a duplicate we could have avoided.
        defaultVisibilityTimeout = 30 seconds
        deadLettersQueue {
            name = "webhook-relay-deliveries-dlq"
            maxReceiveCount = 4
        }
    }
    webhook-relay-deliveries-dlq {}
}
