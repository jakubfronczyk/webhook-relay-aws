# ElasticMQ speaks the SQS wire protocol, so only the endpoint URL differs from AWS.
# These queues mirror what modules/messaging creates.

include classpath("application.conf")

node-address {
    protocol = http
    host = elasticmq
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    # Rejects anything real SQS would reject.
    sqs-limits = strict
}

queues {
    webhook-relay-deliveries {
        # Must stay above worst-case delivery time. Matches modules/messaging.
        defaultVisibilityTimeout = 30 seconds
        deadLettersQueue {
            name = "webhook-relay-deliveries-dlq"
            maxReceiveCount = 4
        }
    }
    webhook-relay-deliveries-dlq {}
}
